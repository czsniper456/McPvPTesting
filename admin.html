<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- LOGIN -->
    <div id="loginBox">
        <h2>Admin Login</h2>
        <input id="githubUser" placeholder="GitHub Username">
        <input id="githubPass" type="password" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>

    <!-- ADMIN PANEL -->
    <div id="adminPanel" style="display:none;">
        <h2>Admin Panel</h2>

        <input id="playerName" placeholder="Player Name">

        <select id="gamemode">
            <option value="sword">Sword</option>
            <option value="axe">Axe</option>
            <option value="mace">Mace</option>
            <option value="uhc">UHC</option>
            <option value="nethpot">NethPot</option>
            <option value="pot">Pot</option>
            <option value="smp">SMP</option>
            <option value="crystal">Crystal</option>
            <option value="spearmace">SpearMace</option>
        </select>

        <select id="tier">
            <option value="HT1">HT1</option>
            <option value="LT1">LT1</option>
            <option value="HT2">HT2</option>
            <option value="LT2">LT2</option>
            <option value="HT3">HT3</option>
            <option value="LT3">LT3</option>
            <option value="HT4">HT4</option>
            <option value="LT4">LT4</option>
            <option value="HT5">HT5</option>
            <option value="LT5">LT5</option>
        </select>

        <button onclick="addPlayer()">Add / Change Tier</button>
        <button onclick="removeRank()">Remove Rank</button>
        <button onclick="deletePlayer()">Delete Player</button>

        <p id="status"></p>
    </div>

    <!-- FULL SCRIPT INSIDE HTML -->
    <script>
    const tierPoints = {
        HT1: 10, LT1: 9, HT2: 8, LT2: 7, HT3: 6, LT3: 5,
        HT4: 4, LT4: 3, HT5: 2, LT5: 1,
        RHT1: 10, RLT1: 9, RHT2: 8, RLT2: 7, RHT3: 6, RLT3: 5,
        RHT4: 4, RLT4: 3, RHT5: 2, RLT5: 1
    };

    function login() {
        const username = document.getElementById("githubUser").value.trim();
        const password = document.getElementById("githubPass").value.trim();

        if (username === "czsniper456" && password === "Noobcztesting_123PvPMC") {
            document.getElementById("loginBox").style.display = "none";
            document.getElementById("adminPanel").style.display = "block";
        } else {
            alert("Access Denied");
        }
    }

    function getPlayers() {
        return JSON.parse(localStorage.getItem("mcpvp_players")) || [];
    }

    function savePlayers(players) {
        localStorage.setItem("mcpvp_players", JSON.stringify(players));
    }

    function addPlayer() {
        const name = document.getElementById("playerName").value.trim();
        const mode = document.getElementById("gamemode").value;
        const tier = document.getElementById("tier").value;

        if (!name) return;

        let players = getPlayers();
        let player = players.find(p => p.name.toLowerCase() === name.toLowerCase());

        if (!player) {
            player = { name, rankings: {} };
            players.push(player);
        }

        player.rankings[mode] = tier;
        savePlayers(players);
        document.getElementById("status").innerText = name + " updated.";
    }

    function removeRank() {
        const name = document.getElementById("playerName").value.trim();
        const mode = document.getElementById("gamemode").value;

        let players = getPlayers();
        let player = players.find(p => p.name.toLowerCase() === name.toLowerCase());

        if (!player) return;

        delete player.rankings[mode];
        savePlayers(players);
        document.getElementById("status").innerText = "Removed " + mode + " from " + name;
    }

    function deletePlayer() {
        const name = document.getElementById("playerName").value.trim();
        let players = getPlayers();

        players = players.filter(p => p.name.toLowerCase() !== name.toLowerCase());
        savePlayers(players);
        document.getElementById("status").innerText = name + " deleted.";
    }
    </script>

</body>
</html>
