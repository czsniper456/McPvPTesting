<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="todo.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">📝 My To-Do List</h1>
            <a href="index.html" class="back-btn">← Back to Ranking</a>
        </div>
    </nav>

    <div class="container">
        <div class="todo-wrapper">
            <div class="input-section">
                <input type="text" id="taskInput" placeholder="Add a new task...">
                <button id="addBtn" class="add-btn">➕ Add Task</button>
            </div>

            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <div class="stats">
                <span>📊 Total: <strong id="totalCount">0</strong></span>
                <span>⏳ Active: <strong id="activeCount">0</strong></span>
                <span>✅ Completed: <strong id="completedCount">0</strong></span>
            </div>

            <ul class="task-list" id="taskList"></ul>

            <div class="actions">
                <button id="clearCompletedBtn" class="action-btn danger">Clear Completed</button>
                <button id="clearAllBtn" class="action-btn danger">Clear All</button>
            </div>
        </div>
    </div>

    <script src="todo.js"></script>
</body>
</html>
