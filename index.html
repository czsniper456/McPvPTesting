<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McPvP Ranking System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">🎮 McPvP Ranking System</h1>
            <button id="adminBtn" class="admin-btn">🔐 Admin Panel</button>
        </div>
    </nav>

    <div class="container">
        <!-- Discord Button -->
        <div class="discord-section">
            <a href="https://discord.gg/T9G65ynzG" target="_blank" class="discord-btn">
                💜 Join Our Discord
            </a>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="leaderboard">📊 Leaderboard</button>
            <button class="tab-btn" data-tab="tiers">🏆 Tier Info</button>
            <button class="tab-btn" data-tab="stats">📈 Statistics</button>
            <button class="tab-btn" data-tab="admin" id="adminTabBtn" style="display:none;">⚙️ Admin</button>
        </div>

        <!-- Leaderboard Tab -->
        <div id="leaderboard" class="tab-content active">
            <div class="filter-section">
                <input type="text" id="searchBox" placeholder="Search player...">
                <select id="tierFilter">
                    <option value="">All Tiers</option>
                    <option value="Mythic">Mythic</option>
                    <option value="Legend">Legend</option>
                    <option value="Elite">Elite</option>
                    <option value="Master">Master</option>
                    <option value="Diamond">Diamond</option>
                    <option value="Platinum">Platinum</option>
                    <option value="Gold">Gold</option>
                    <option value="Silver">Silver</option>
                    <option value="Bronze">Bronze</option>
                    <option value="Unranked">Unranked</option>
                </select>
            </div>
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Player</th>
                        <th>Tier</th>
                        <th>Wins</th>
                        <th>Kills</th>
                        <th>K/W Ratio</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody">
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>

        <!-- Tiers Tab -->
        <div id="tiers" class="tab-content">
            <div class="tiers-grid" id="tiersGrid">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- Statistics Tab -->
        <div id="stats" class="tab-content">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Players</h3>
                    <p id="totalPlayers">0</p>
                </div>
                <div class="stat-card">
                    <h3>Total Wins</h3>
                    <p id="totalWins">0</p>
                </div>
                <div class="stat-card">
                    <h3>Total Kills</h3>
                    <p id="totalKills">0</p>
                </div>
                <div class="stat-card">
                    <h3>Avg K/W Ratio</h3>
                    <p id="avgRatio">0</p>
                </div>
            </div>
        </div>

        <!-- Admin Tab -->
        <div id="admin" class="tab-content">
            <div class="admin-login">
                <h2>🔐 Admin Panel</h2>
                <div id="loginForm">
                    <input type="text" id="adminUsername" placeholder="Enter your GitHub username">
                    <button onclick="adminLogin()">Login</button>
                </div>
                <div id="adminPanel" style="display:none;">
                    <h3>Manage Players</h3>
                    <div class="admin-form">
                        <input type="text" id="playerName" placeholder="Player name (Minecraft username)">
                        <select id="playerTier">
                            <option value="Unranked">Unranked</option>
                            <option value="Bronze">Bronze</option>
                            <option value="Silver">Silver</option>
                            <option value="Gold">Gold</option>
                            <option value="Platinum">Platinum</option>
                            <option value="Diamond">Diamond</option>
                            <option value="Master">Master</option>
                            <option value="Elite">Elite</option>
                            <option value="Legend">Legend</option>
                            <option value="Mythic">Mythic</option>
                        </select>
                        <input type="number" id="playerWins" placeholder="Wins" min="0">
                        <input type="number" id="playerKills" placeholder="Kills" min="0">
                        <button onclick="addPlayer()">Add/Update Player</button>
                    </div>

                    <h3>Players List</h3>
                    <div id="playersList"></div>

                    <h3>Export/Import</h3>
                    <button onclick="exportData()">📥 Export Data</button>
                    <button onclick="document.getElementById('importFile').click()">📤 Import Data</button>
                    <input type="file" id="importFile" style="display:none;" accept=".json">

                    <h3>Danger Zone</h3>
                    <button onclick="clearCompleted()" class="danger-btn">Clear Completed Tier</button>
                    <button onclick="clearAll()" class="danger-btn">Clear All Data</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
