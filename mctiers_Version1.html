<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCTIERS Ranking System</title>
    <link rel="stylesheet" href="mctiers.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">🎮 MCTIERS Ranking System</h1>
            <button id="adminBtn" class="admin-btn">🔐 Admin Panel</button>
        </div>
    </nav>

    <div class="container">
        <!-- Discord Button -->
        <div class="discord-section">
            <a href="https://discord.gg/T9G65ynzG" target="_blank" class="discord-btn">
                💜 Join Our Discord
            </a>
        </div>

        <!-- Gamemode Buttons -->
        <div class="gamemode-buttons">
            <button class="gamemode-btn active" data-gamemode="overall">📊 Overall</button>
            <button class="gamemode-btn" data-gamemode="crystal">💎 Crystal</button>
            <button class="gamemode-btn" data-gamemode="axe">🪓 Axe</button>
            <button class="gamemode-btn" data-gamemode="sword">⚔️ Sword</button>
            <button class="gamemode-btn" data-gamemode="mace">🔨 Mace</button>
            <button class="gamemode-btn" data-gamemode="uhc">💘 UHC</button>
            <button class="gamemode-btn" data-gamemode="smp">🌍 SMP</button>
            <button class="gamemode-btn" data-gamemode="neth_pot">🌶️ Neth Pot</button>
            <button class="gamemode-btn" data-gamemode="pot">🍷 Pot</button>
            <button class="gamemode-btn" data-gamemode="spearmace">🗡️ Spearmace</button>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="leaderboard">📊 Leaderboard</button>
            <button class="tab-btn" data-tab="tiers">🏆 Tier Info</button>
            <button class="tab-btn" data-tab="stats">📈 Statistics</button>
            <button class="tab-btn" data-tab="admin" id="adminTabBtn" style="display:none;">⚙️ Admin</button>
        </div>

        <!-- Leaderboard Tab -->
        <div id="leaderboard" class="tab-content active">
            <div class="filter-section">
                <input type="text" id="searchBox" placeholder="Search player...">
                <select id="tierFilter">
                    <option value="">All Tiers</option>
                    <option value="HT1">HT1</option>
                    <option value="HT2">HT2</option>
                    <option value="HT3">HT3</option>
                    <option value="LT1">LT1</option>
                    <option value="LT2">LT2</option>
                    <option value="LT3">LT3</option>
                    <option value="LT4">LT4</option>
                    <option value="LT5">LT5</option>
                    <option value="RHT1">RHT1</option>
                    <option value="RHT2">RHT2</option>
                    <option value="RHT3">RHT3</option>
                    <option value="RLT1">RLT1</option>
                    <option value="RLT2">RLT2</option>
                    <option value="RLT3">RLT3</option>
                    <option value="RLT4">RLT4</option>
                    <option value="RLT5">RLT5</option>
                </select>
            </div>
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Player</th>
                        <th>Tier</th>
                        <th>Points</th>
                        <th id="gamemode-header">Overall</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody">
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>

        <!-- Tiers Tab -->
        <div id="tiers" class="tab-content">
            <div class="tiers-grid" id="tiersGrid">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- Statistics Tab -->
        <div id="stats" class="tab-content">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Players</h3>
                    <p id="totalPlayers">0</p>
                </div>
                <div class="stat-card">
                    <h3>HT1 Players</h3>
                    <p id="ht1Count">0</p>
                </div>
                <div class="stat-card">
                    <h3>LT1 Players</h3>
                    <p id="lt1Count">0</p>
                </div>
                <div class="stat-card">
                    <h3>Avg Points</h3>
                    <p id="avgPoints">0</p>
                </div>
            </div>
        </div>

        <!-- Admin Tab -->
        <div id="admin" class="tab-content">
            <div class="admin-login">
                <h2>🔐 Admin Panel</h2>
                <div id="loginForm">
                    <input type="text" id="adminUsername" placeholder="Enter your GitHub username">
                    <button onclick="adminLogin()">Login</button>
                </div>
                <div id="adminPanel" style="display:none;">
                    <h3>Add/Update Player Tiers</h3>
                    <div class="admin-form">
                        <input type="text" id="playerName" placeholder="Player name">
                        
                        <div class="gamemode-inputs">
                            <div class="gamemode-input-group">
                                <label>💎 Crystal</label>
                                <select id="crystal-tier">
                                    <option value="">None</option>
                                    <option value="HT1">HT1</option>
                                    <option value="HT2">HT2</option>
                                    <option value="HT3">HT3</option>
                                    <option value="LT1">LT1</option>
                                    <option value="LT2">LT2</option>
                                    <option value="LT3">LT3</option>
                                    <option value="LT4">LT4</option>
                                    <option value="LT5">LT5</option>
                                    <option value="RHT1">RHT1</option>
                                    <option value="RHT2">RHT2</option>
                                    <option value="RHT3">RHT3</option>
                                    <option value="RLT1">RLT1</option>
                                    <option value="RLT2">RLT2</option>
                                    <option value="RLT3">RLT3</option>
                                    <option value="RLT4">RLT4</option>
                                    <option value="RLT5">RLT5</option>
                                </select>
                            </div>

                            <div class="gamemode-input-group">
                                <label>🪓 Axe</label>
                                <select id="axe-tier">
                                    <option value="">None</option>
                                    <option value="HT1">HT1</option>
                                    <option value="HT2">HT2</option>
                                    <option value="HT3">HT3</option>
                                    <option value="LT1">LT1</option>
                                    <option value="LT2">LT2</option>
                                    <option value="LT3">LT3</option>
                                    <option value="LT4">LT4</option>
                                    <option value="LT5">LT5</option>
                                    <option value="RHT1">RHT1</option>
                                    <option value="RHT2">RHT2</option>
                                    <option value="RHT3">RHT3</option>
                                    <option value="RLT1">RLT1</option>
                                    <option value="RLT2">RLT2</option>
                                    <option value="RLT3">RLT3</option>
                                    <option value="RLT4">RLT4</option>
                                    <option value="RLT5">RLT5</option>
                                </select>
                            </div>

                            <div class="gamemode-input-group">
                                <label>⚔️ Sword</label>
                                <select id="sword-tier">
                                    <option value="">None</option>
                                    <option value="HT1">HT1</option>
                                    <option value="HT2">HT2</option>
                                    <option value="HT3">HT3</option>
                                    <option value="LT1">LT1</option>
                                    <option value="LT2">LT2</option>
                                    <option value="LT3">LT3</option>
                                    <option value="LT4">LT4</option>
                                    <option value="LT5">LT5</option>
                                    <option value="RHT1">RHT1</option>
                                    <option value="RHT2">RHT2</option>
                                    <option value="RHT3">RHT3</option>
                                    <option value="RLT1">RLT1</option>
                                    <option value="RLT2">RLT2</option>
                                    <option value="RLT3">RLT3</option>
                                    <option value="RLT4">RLT4</option>
                                    <option value="RLT5">RLT5</option>
                                </select>
                            </div>

                            <div class="gamemode-input-group">
                                <label>🔨 Mace</label>
                                <select id="mace-tier">
                                    <option value="">None</option>
                                    <option value="HT1">HT1</option>
                                    <option value="HT2">HT2</option>
                                    <option value="HT3">HT3</option>
                                    <option value="LT1">LT1</option>
                                    <option value="LT2">LT2</option>
                                    <option value="LT3">LT3</option>
                                    <option value="LT4">LT4</option>
                                    <option value="LT5">LT5</option>
                                    <option value="RHT1">RHT1</option>
                                    <option value="RHT2">RHT2</option>
                                    <option value="RHT3">RHT3</option>
                                    <option value="RLT1">RLT1</option>
                                    <option value="RLT2">RLT2</option>
                                    <option value="RLT3">RLT3</option>
                                    <option value="RLT4">RLT4</option>
                                    <option value="RLT5">RLT5</option>
                                </select>
                            </div>

                            <div class="gamemode-input-group">
                                <label>💘 UHC</label>
                                <select id="uhc-tier">
                                    <option value="">None</option>
                                    <option value="HT1">HT1</option>
                                    <option value="HT2">HT2</option>
                                    <option value="HT3">HT3</option>
                                    <option value="LT1">LT1</option>
                                    <option value="LT2">LT2</option>
                                    <option value="LT3">LT3</option>
                                    <option value="LT4">LT4</option>
                                    <option value="LT5">LT5</option>
                                    <option value="RHT1">RHT1</option>
                                    <option value="RHT2">RHT2</option>
                                    <option value="RHT3">RHT3</option>
                                    <option value="RLT1">RLT1</option>
                                    <option value="RLT2">RLT2</option>
                                    <option value="RLT3">RLT3</option>
                                    <option value="RLT4">RLT4</option>
                                    <option value="RLT5">RLT5</option>
                                </select>
                            </div>

                            <div class="gamemode-input-group">
                                <label>🌍 SMP</label>
                                <select id="smp-tier">
                                    <option value="">None</option>
                                    <option value="HT1">HT1</option>
                                    <option value="HT2">HT2</option>
                                    <option value="HT3">HT3</option>
                                    <option value="LT1">LT1</option>
                                    <option value="LT2">LT2</option>
                                    <option value="LT3">LT3</option>
                                    <option value="LT4">LT4</option>
                                    <option value="LT5">LT5</option>
                                    <option value="RHT1">RHT1</option>
                                    <option value="RHT2">RHT2</option>
                                    <option value="RHT3">RHT3</option>
                                    <option value="RLT1">RLT1</option>
                                    <option value="RLT2">RLT2</option>
                                    <option value="RLT3">RLT3</option>
                                    <option value="RLT4">RLT4</option>
                                    <option value="RLT5">RLT5</option>
                                </select>
                            </div>

                            <div class="gamemode-input-group">
                                <label>🌶️ Neth Pot</label>
                                <select id="neth_pot-tier">
                                    <option value="">None</option>
                                    <option value="HT1">HT1</option>
                                    <option value="HT2">HT2</option>
                                    <option value="HT3">HT3</option>
                                    <option value="LT1">LT1</option>
                                    <option value="LT2">LT2</option>
                                    <option value="LT3">LT3</option>
                                    <option value="LT4">LT4</option>
                                    <option value="LT5">LT5</option>
                                    <option value="RHT1">RHT1</option>
                                    <option value="RHT2">RHT2</option>
                                    <option value="RHT3">RHT3</option>
                                    <option value="RLT1">RLT1</option>
                                    <option value="RLT2">RLT2</option>
                                    <option value="RLT3">RLT3</option>
                                    <option value="RLT4">RLT4</option>
                                    <option value="RLT5">RLT5</option>
                                </select>
                            </div>

                            <div class="gamemode-input-group">
                                <label>🍷 Pot</label>
                                <select id="pot-tier">
                                    <option value="">None</option>
                                    <option value="HT1">HT1</option>
                                    <option value="HT2">HT2</option>
                                    <option value="HT3">HT3</option>
                                    <option value="LT1">LT1</option>
                                    <option value="LT2">LT2</option>
                                    <option value="LT3">LT3</option>
                                    <option value="LT4">LT4</option>
                                    <option value="LT5">LT5</option>
                                    <option value="RHT1">RHT1</option>
                                    <option value="RHT2">RHT2</option>
                                    <option value="RHT3">RHT3</option>
                                    <option value="RLT1">RLT1</option>
                                    <option value="RLT2">RLT2</option>
                                    <option value="RLT3">RLT3</option>
                                    <option value="RLT4">RLT4</option>
                                    <option value="RLT5">RLT5</option>
                                </select>
                            </div>

                            <div class="gamemode-input-group">
                                <label>🗡️ Spearmace</label>
                                <select id="spearmace-tier">
                                    <option value="">None</option>
                                    <option value="HT1">HT1</option>
                                    <option value="HT2">HT2</option>
                                    <option value="HT3">HT3</option>
                                    <option value="LT1">LT1</option>
                                    <option value="LT2">LT2</option>
                                    <option value="LT3">LT3</option>
                                    <option value="LT4">LT4</option>
                                    <option value="LT5">LT5</option>
                                    <option value="RHT1">RHT1</option>
                                    <option value="RHT2">RHT2</option>
                                    <option value="RHT3">RHT3</option>
                                    <option value="RLT1">RLT1</option>
                                    <option value="RLT2">RLT2</option>
                                    <option value="RLT3">RLT3</option>
                                    <option value="RLT4">RLT4</option>
                                    <option value="RLT5">RLT5</option>
                                </select>
                            </div>
                        </div>

                        <button onclick="addPlayer()">✅ Add/Update Player</button>
                    </div>

                    <h3>Players List</h3>
                    <div id="playersList"></div>

                    <h3>Export/Import</h3>
                    <button onclick="exportData()">📥 Export Data</button>
                    <button onclick="document.getElementById('importFile').click()">📤 Import Data</button>
                    <input type="file" id="importFile" style="display:none;" accept=".json">

                    <h3>Danger Zone</h3>
                    <button onclick="clearAll()" class="danger-btn">Clear All Data</button>
                </div>
            </div>
        </div>
    </div>

    <script src="mctiers.js"></script>
</body>
</html>
